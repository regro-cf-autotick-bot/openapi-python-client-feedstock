{% set name = "openapi-python-client" %}
{% set version = "0.10.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/openapi-python-client-{{ version }}.tar.gz
  sha256: e99c01d5d69329697e0b49623184816d42043469a188384fa743faecbeb0f0e4

build:
  number: 0
  noarch: python
  entry_points:
    - openapi-python-client = openapi_python_client.cli:app
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry
    - python >=3.11
  run:
    - attrs >=22.2.0
    - colorama >=0.4.3
    - httpx >=0.23.1,<0.29.0
    - jinja2 >=3.0.0,<4.0.0
    - pydantic >=2.10,<3.0.0
    - python >=3.11
    - ruamel.yaml>=0.18.6,<0.20.0",
    - ruff >= 0.2
    - shellingham >=1.3.2,<2.0.0
    - typer >0.16,<0.27

test:
  imports:
    - openapi_python_client
    - openapi_python_client.parser
  commands:
    - pip check
    - openapi-python-client --help
  requires:
    - pip

about:
  home: https://github.com/openapi-generators/openapi-python-client
  summary: Generate modern Python clients from OpenAPI
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - asford
